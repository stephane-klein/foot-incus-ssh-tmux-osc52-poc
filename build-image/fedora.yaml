# This file is based on https://github.com/lxc/lxc-ci/blob/main/images/fedora.yaml
image:
  distribution: fedora
  release: "44"
  name: fedora-44-sklein
  variant: cloud

source:
  downloader: fedora-http
  url: https://kojipkgs.fedoraproject.org

targets:
  lxc:
    create_message: |
      You just created a {{ image.description }} container.
    config:
    - type: all
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/fedora.common.conf

    - type: user
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/fedora.userns.conf

    - type: all
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/common.conf

    - type: user
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/userns.conf

    - type: all
      content: |-
        lxc.arch = {{ image.architecture_kernel }}

files:
- path: /etc/systemd/system-preset/00-lxc-fedora.preset
  generator: dump
  content: |-
    # Preserve image-selected network services across systemd first boot.
    ignore systemd-resolved.service
    ignore systemd-networkd.service

- path: /etc/default/grub
  generator: dump
  content: |-
    # Set the recordfail timeout
    GRUB_RECORDFAIL_TIMEOUT=0

    # Do not wait on grub prompt
    GRUB_TIMEOUT=0

    # Set the default commandline
    GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=tty1 console=ttyS0"

    # Set the grub console type
    GRUB_TERMINAL=console

    # Disable os-prober
    GRUB_DISABLE_OS_PROBER=true
  types:
  - vm

- path: /etc/dracut.conf.d/incus.conf
  generator: dump
  content: |-
    add_drivers+=" virtio_scsi "
  types:
  - vm

- generator: fstab
  types:
  - vm

- path: /etc/machine-id
  generator: dump
  content: uninitialized

- path: /var/lib/dbus/machine-id
  generator: remove

- path: /etc/fstab
  generator: dump
  types:
  - container

- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- name: eth0.network
  path: /etc/systemd/network/eth0.network
  generator: dump
  content: |-
    [Match]
    Name=eth0

    [Network]
    DHCP=ipv4

    [DHCPv4]
    UseDomains=true
    UseMTU=true

    [DHCP]
    ClientIdentifier=mac
  variants:
  - default
  types:
  - container

- name: enp5s0.network
  path: /etc/systemd/network/enp5s0.network
  generator: dump
  content: |-
    [Match]
    Name=enp5s0

    [Network]
    DHCP=ipv4

    [DHCPv4]
    UseDomains=true
    UseMTU=true

    [DHCP]
    ClientIdentifier=mac
  variants:
  - default
  types:
  - vm

- path: /usr/local/sbin/enroll-netbird.sh
  generator: dump
  content: |-
    #!/bin/sh
    set -eu

    # Enroll the instance into NetBird if a setup key is provided.
    # Usage: enroll-netbird.sh <setup-key-file>
    # The setup key is read by netbird itself from the file (--setup-key-file).
    # With an empty or missing file, this is a no-op.
    KEY_FILE="${1:-}"

    # No-op when no key file is provided, or it does not exist or is empty.
    if [ -z "${KEY_FILE}" ] || [ ! -s "${KEY_FILE}" ]; then
      exit 0
    fi

    # Remove the setup key file on exit, whether enrollment succeeds or not.
    trap 'rm -f "${KEY_FILE}"' EXIT

    # The netbird daemon is not part of the image (the RPM %post that installs
    # the service is skipped at build time with tsflags=noscripts), so install
    # and start it here, at runtime, where systemd is running.
    export HOME=/root
    export XDG_CONFIG_HOME=/root/.config

    netbird service install || true
    netbird service start || true

    # Wait for the daemon socket to appear.
    SOCKET=""
    i=0
    while [ -z "${SOCKET}" ] && [ "${i}" -lt 30 ]; do
      if [ -S /var/run/netbird.sock ]; then
        SOCKET=/var/run/netbird.sock
      else
        for f in /var/run/netbird/*.sock; do
          if [ -S "${f}" ]; then
            SOCKET="${f}"
            break
          fi
        done
      fi
      [ -z "${SOCKET}" ] && sleep 1
      i=$((i + 1))
    done

    [ -n "${SOCKET}" ] || {
      echo "enroll-netbird.sh: netbird daemon socket not found" >&2
      exit 1
    }

    # Bring the interface up. Retry a few times as the daemon may still be
    # settling. The setup key is read by netbird from the file. Failing to
    # enroll is a hard error (blocking cloud-init).
    attempt=0
    while ! netbird up --daemon-addr "unix://${SOCKET}" --setup-key-file "${KEY_FILE}"; do
      attempt=$((attempt + 1))
      if [ "${attempt}" -ge 5 ]; then
        echo "enroll-netbird.sh: netbird up failed after ${attempt} attempts" >&2
        exit 1
      fi
      sleep 5
    done

    exit 0

- path: /usr/local/bin/ssh-tmux-login
  generator: dump
  content: |-
    #!/bin/sh
    # Launch wrapper forced by sshd (Match User fedora / ForceCommand) so tmux
    # starts by default on interactive login, whatever the user's shell is.
    #
    # Behaviour:
    #   - a command was requested by the client (ssh host <cmd>, rsync, sftp)
    #     -> run it unchanged
    #   - no tty allocated (e.g. plain `ssh host` without -t)
    #     -> plain login shell, no tmux
    #   - otherwise -> tmux session grouped with the shared "main" workspace
    #     (tmux session groups / screen -x model): every console shares the
    #     same windows and panes but keeps its own current window
    #
    # Opt-out without tmux: `ssh -t host bash` (or zsh/fish, `bash -l` for a
    # login shell). The requested command is routed below, so tmux is simply
    # not launched for such sessions.
    set -eu

    login_shell=$(getent passwd "$(id -un)" | cut -d: -f7)
    login_shell=${login_shell:-/bin/sh}

    if [ -n "${SSH_ORIGINAL_COMMAND:-}" ]; then
      case "$SSH_ORIGINAL_COMMAND" in
        *sftp-server*) exec /usr/libexec/openssh/sftp-server ;;
        *)             exec "$login_shell" -c "$SSH_ORIGINAL_COMMAND" ;;
      esac
    fi

    # No pseudo-terminal: not an interactive console session, do not start tmux.
    [ -t 0 ] || exec "$login_shell"

    # --- Shared workspace in grouped sessions (screen -x model) ---
    # "main" is the anchor session hosting the shared windows/panes. Each ssh
    # console attaches its own session grouped with main: same windows, but an
    # independent current window per console.
    #
    # Console sessions are kept after a client detaches; unattached ones are
    # reaped on the next login. Full manual cleanup:
    #   tmux kill-session -a -t main   (kills every session except main)
    if ! tmux has-session -t main 2>/dev/null; then
      tmux new-session -d -s main 2>/dev/null || true
    fi

    tmux list-sessions -F '#{session_attached}:#{session_name}' 2>/dev/null |
    while IFS=: read -r attached name; do
      case "$name" in
        console-*) ;;
        *) continue ;;
      esac
      [ "$attached" = 0 ] || continue
      tmux kill-session -t "$name" 2>/dev/null || true
    done

    console_session="console-$(date +%s)-$$"
    tmux new-session -d -t main -s "$console_session" 2>/dev/null || true
    exec tmux attach-session -t "$console_session"

- path: /etc/ssh/sshd_config.d/tmux-force.conf
  generator: dump
  content: |-
    # Force every session of the "fedora" user through the shared launcher
    # (/usr/local/bin/ssh-tmux-login) so tmux starts by default on interactive
    # ssh login, whatever the user's shell is.
    #
    #   ssh -t host        -> tmux (default)
    #   ssh -t host bash   -> plain interactive shell, no tmux (opt-out)
    #   ssh host '<cmd>'   -> command/subsystem preserved (scp, rsync...)
    #   ssh host (no tty)  -> login shell, no tmux
    Match User fedora
        ForceCommand /usr/local/bin/ssh-tmux-login

- name: meta-data
  generator: cloud-init
  variants:
  - cloud

- name: network-config
  generator: cloud-init
  content: |-
    {% if config_get("user.network-config", "") == "" %}version: 1
    config:
      - type: physical
        name: {% if instance.type == "virtual-machine" %}enp5s0{% else %}eth0{% endif %}
        subnets:
          - type: {% if config_get("user.network_mode", "") == "link-local" %}manual{% else %}dhcp{% endif %}
            control: auto
          - type: dhcp6
            control: auto{% else %}{{ config_get("user.network-config", "") }}{% endif %}
  variants:
  - cloud

- name: user-data
  generator: cloud-init
  variants:
  - cloud

- name: vendor-data
  generator: cloud-init
  variants:
  - cloud

- generator: incus-agent
  types:
  - vm

packages:
  manager: dnf
  update: true
  cleanup: true
  repositories:
  - name: netbird
    url: |-
      [netbird]
      name=netbird
      baseurl=https://pkgs.netbird.io/yum/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.netbird.io/yum/repodata/repomd.xml.key
      repo_gpgcheck=1
  sets:
  - packages:
    - cpio
    - file
    - findutils
    - fipscheck
    - gettext
    - glibc-all-langpacks
    - hardlink
    - hostname
    - ipcalc
    - iproute
    - iproute-tc
    - iputils
    - kbd
    - kmod
    - openssh-clients
    - openssh-server
    - passwd
    - pigz
    - policycoreutils
    - procps-ng
    - sudo
    - systemd-udev
    - which
    - xz
    - tmux
    - neovim
    - chafa
    - ImageMagick
    - libsixel-utils
    action: install

  - packages:
    - cloud-init
    action: install
    variants:
    - cloud

  - packages:
    - netbird
    action: install
    flags:
    - "--setopt=tsflags=noscripts"

  - packages:
    - podman
    - podman-compose
    action: install

  - packages:
    - cloud-init
    action: install
    variants:
    - cloud

  - packages:
    - cloud-utils-growpart
    action: install
    types:
    - vm
    variants:
    - cloud

  - packages:
    - grub2-efi-x64
    action: install
    architectures:
    - x86_64
    types:
    - vm

  - packages:
    - grub2-efi-aa64
    action: install
    architectures:
    - aarch64
    types:
    - vm

  - packages:
    - kernel
    - shim
    - dracut
    action: install
    types:
    - vm

  - packages:
    - lvm2
    - lvm2-libs
    action: remove
    types:
    - vm

  - packages:
    - libsss_idmap
    - libsss_nss_idmap
    - sssd-client
    action: remove

actions:
- trigger: post-unpack
  action: |-
    #!/bin/sh

    set -eux

    # Increase connection timeout
    echo timeout=60 >> /etc/dnf/dnf.conf

    # Let dnf find the fastest mirror
    echo fastestmirror=True >> /etc/dnf/dnf.conf

    # Backup all repo files
    for repo in $(ls /etc/yum.repos.d/*.repo); do
      cp "${repo}" "${repo}.bak"
    done

- trigger: post-unpack
  action: |-
    #!/bin/sh

    set -eux

    # Use Fedora 38 GPG key to avoid package installation errors
    for repo in $(ls /etc/yum.repos.d/*.repo); do
      grep -q 'RPM-GPG-KEY-fedora-38' "${repo}" && continue

      sed -ri 's#^gpgkey=.*#\0 file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-38-$basearch#g' "${repo}"
    done
  architectures:
  - aarch64
  - x86_64
  releases:
  - Rawhide

- trigger: post-unpack
  action: |-
    #!/bin/sh

    set -eux

    # Use baseurl instead of metalink to avoid networking issues
    for repo in $(ls /etc/yum.repos.d/*.repo); do
      grep -q '^#baseurl' "${repo}" || continue

      sed -ri 's/^metalink=.*/#\0/g;s@^#(baseurl=)http://download.example/pub/fedora/linux(.*)@\1https://muug.ca/mirror/fedora-secondary\2@g' "${repo}"
    done
  architectures:
  - ppc64le
  - s390x

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    umount -l /etc/resolv.conf || true
    rm /etc/resolv.conf
    ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
    cp -R /etc/skel/.bash* /root/

    systemctl enable systemd-resolved
    systemctl enable systemd-networkd

    systemctl mask systemd-homed-firstboot.service || true

    # Re-apply all the capabilities.
    rpm -qa | sudo xargs -n1 rpm --setcaps || true

    exit 0

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    systemctl enable sshd

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    useradd --user-group --create-home --shell /bin/bash fedora
    echo "fedora ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/fedora
    passwd -l root

# OSC 52 bidirectional clipboard for the foot -> ssh -> tmux chain.
# foot supports OSC 52 but ships no Ms terminfo capability, so tmux must be
# told (clipboard feature) that a client reporting TERM=foot may set the
# system clipboard; otherwise tmux never emits OSC 52 towards foot.
# Written in post-packages (not files:) so /home/fedora exists and skel files
# were already copied by useradd --create-home.
- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    cat > /home/fedora/.tmux.conf <<'EOF'
    # OSC 52 bidirectional clipboard for the foot -> ssh -> tmux chain.
    set -g set-clipboard on
    set -g get-clipboard both
    set -ag terminal-features 'foot:clipboard'
    # Mouse selection in a pane triggers a tmux copy sent to foot via OSC 52.
    set -g mouse on
    # Neovim-like copy mode: prefix + [ then v to start a selection, move the
    # cursor (hjkl/w/b), y or Enter to copy, q to cancel.
    set -g mode-keys vi
    set -wg mode-keys vi
    bind-key -T copy-mode-vi v send-keys -X begin-selection
    bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
    # SIXEL image display for the foot -> ssh -> tmux chain.
    # allow-passthrough (tmux >= 3.3) forwards image escape sequences verbatim
    # to foot, which renders sixel at full quality (image.nvim backend and
    # `chafa --passthrough` rely on this).
    set -g allow-passthrough on
    # Fallback: tell tmux foot supports sixel, so raw sixel emitted in a pane
    # (img2sixel, chafa without passthrough) is handled by tmux and forwarded.
    set -ag terminal-features 'foot:sixel'
    # Needed by image.nvim for correct show/hide of images across tmux windows.
    set -g focus-events on
    set -g visual-activity off
    EOF
    chown fedora:fedora /home/fedora/.tmux.conf
    chmod 0644 /home/fedora/.tmux.conf

# Neovim clipboard over OSC 52: the instance is headless (no X/Wayland), so
# the default system clipboard provider would not work. Wire the built-in
# OSC 52 provider (vim.ui.clipboard.osc52) and make y/p use it through
# clipboard=unnamedplus. Like .tmux.conf this is written in post-packages so
# /home/fedora exists.
- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    mkdir -p /home/fedora/.config/nvim
    cat > /home/fedora/.config/nvim/init.lua <<'EOF'
    local osc52 = require('vim.ui.clipboard.osc52')
    vim.g.clipboard = {
      name = 'OSC 52',
      copy = { ['+'] = osc52.copy('+'), ['*'] = osc52.copy('*') },
      paste = { ['+'] = osc52.paste('+'), ['*'] = osc52.paste('*') },
    }
    vim.opt.clipboard = 'unnamedplus'

    -- Image display over the foot -> ssh -> tmux chain (SIXEL backend).
    -- image.nvim wraps the sixel stream in a tmux passthrough sequence so foot
    -- (the outer terminal) renders it at full quality. Requires tmux option
    -- allow-passthrough on (see ~/.tmux.conf).
    local ok, image = pcall(require, "image")
    if ok then
      image.setup({
        backend = "sixel",
        processor = "magick_cli",
        integrations = {
          markdown = {
            enabled = true,
            only_render_image_at_cursor = true,
          },
        },
        max_width_window_percentage = 100,
        max_height_window_percentage = 100,
      })
    end
    EOF
    chown -R fedora:fedora /home/fedora/.config
    chmod 0644 /home/fedora/.config/nvim/init.lua

    # image.nvim (SIXEL backend) for inline images in nvim; pinned tag v1.5.1.
    # Installed as a plain native pack so no plugin manager is needed. curl and
    # tar are part of the base Fedora cloud image.
    mkdir -p /home/fedora/.local/share/nvim/site/pack/vendor/start
    curl -fsSL -o /tmp/image.nvim.tgz https://codeload.github.com/3rd/image.nvim/tar.gz/refs/tags/v1.5.1
    mkdir -p /tmp/image.nvim-extract
    tar -xzf /tmp/image.nvim.tgz -C /tmp/image.nvim-extract
    mv /tmp/image.nvim-extract/image.nvim-* /home/fedora/.local/share/nvim/site/pack/vendor/start/image.nvim
    rm -rf /tmp/image.nvim.tgz /tmp/image.nvim-extract
    chown -R fedora:fedora /home/fedora/.local/share/nvim

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    # newuidmap/newgidmap must be setuid root for rootless podman to be able
    # to write the uid_map/gid_map of its nested user namespace.
    chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

- trigger: post-packages
  action: |-
    #!/bin/sh
    systemctl enable cloud-init
    systemctl enable cloud-config
    systemctl enable cloud-final
    systemctl mask dhcpcd
  variants:
  - cloud

- trigger: post-unpack
  action: |-
    #!/bin/sh
    # Generate machine-id in order for the kernel stuff to be configured properly
    # Toléré si absent : l'image de base Fedora ne livre plus systemd-machine-id-setup
    if command -v systemd-machine-id-setup >/dev/null 2>&1; then
      systemd-machine-id-setup
    fi
  types:
  - vm

- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    # Remove the "Container Image" string as this is going to be am VM
    sed -i 's/[ ]*(Container Image)//;/^VARIANT/d' /etc/os-release

    target=/boot/efi/EFI/fedora/grub.cfg
    grub2-mkconfig -o "${target}"
    sed -i "s#root=[^ ]*#root=${DISTROBUILDER_ROOT_UUID}#g" "${target}"

    # grub2-mkconfig runs inside the distrobuilder build rootfs and can record the
    # absolute build path (e.g. /root/var/cache/distrobuilder.<id>/rootfs/boot/...)
    # in the menu entries (grub.cfg and /boot/loader/entries/*) instead of the
    # /boot/... path the VM actually uses. Strip any such prefix so the kernel
    # and initramfs resolve correctly at boot.
    sed -ri 's#[^ ]*/boot#/boot#g' "${target}"
    sed -Eri 's#(^(linux|initrd|linuxefi) )[^ ]*/boot#\1/boot#g' /boot/loader/entries/*
    sed -ri 's#^options .+#options $kernelopts#g' /boot/loader/entries/*

    # Regenerate initramfs
    kver=$(ls /boot/initramfs-*.img | sed -r 's#.*initramfs-(.+)\.img#\1#')
    dracut --kver "${kver}" -f

    # Unmask all masked unit files
    for f in $(find /etc/systemd/system -type l); do
      [ "$(readlink ${f})" = "/dev/null" ] && rm "${f}"
    done

    # Wipe grub environment
    rm -f /boot/efi/EFI/fedora/grubenv

    exit 0
  types:
  - vm

- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    # Restore repos
    for repo in $(ls /etc/yum.repos.d/*.bak); do
      mv "${repo}" ${repo%.*}
    done

    # Disable first boot wizard
    systemctl mask systemd-firstboot.service

    # Disable xfs_healer
    systemctl mask xfs_healer@-.service

- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    # distrobuilder writes dumped files without the executable bit.
    chmod 0755 /usr/local/bin/ssh-tmux-login
