[main]
font=Hack Nerd Font Mono:size=11
shell=/usr/bin/tmux new-session
term=foot

[security]
osc52=enabled

[csd]
preferred=none
size=0
border-width=0

# Catppuccin color themes for foot.
# Source: https://github.com/catppuccin/foot (themes/catppuccin-macchiato.ini and themes/catppuccin-latte.ini)
# Switch theme at runtime with SIGUSR1 (dark) / SIGUSR2 (light)

[colors-dark]
cursor=181926 f4dbd6
foreground=cad3f5
background=24273a
alpha=0.99
regular0=494d64
regular1=ed8796
regular2=a6da95
regular3=eed49f
regular4=8aadf4
regular5=f5bde6
regular6=8bd5ca
regular7=b8c0e0
bright0=5b6078
bright1=ed8796
bright2=a6da95
bright3=eed49f
bright4=8aadf4
bright5=f5bde6
bright6=8bd5ca
bright7=a5adcb
selection-foreground=cad3f5
selection-background=454a5f

[colors-light]
cursor=eff1f5 dc8a78
foreground=4c4f69
background=eff1f5
alpha=0.99
regular0=5c5f77
regular1=d20f39
regular2=40a02b
regular3=df8e1d
regular4=1e66f5
regular5=ea76cb
regular6=179299
regular7=acb0be
bright0=6c6f85
bright1=d20f39
bright2=40a02b
bright3=df8e1d
bright4=1e66f5
bright5=ea76cb
bright6=179299
bright7=bcc0cc
selection-foreground=4c4f69
selection-background=ccced7

[environment]
TERM=foot

[key-bindings]
spawn-terminal=Control+Shift+n
color-theme-toggle=Control+Shift+F5
